<div id="why-us-widget" class="py-16 lg:py-24 bg-gradient-to-b from-gray-50 to-white overflow-hidden">
    <div class="max-w-4xl mx-auto px-6 mb-16 text-center scroll-animate">
        <h2 class="text-3xl lg:text-5xl font-semibold text-slate-700 mb-6"><span class="border-b-4 border-orange-400 pb-1">Why</span> choose us</h2>
        <p class="text-sm lg:text-base text-slate-600 font-medium leading-relaxed">Who we work with - We partner with Businesses, Local Governments, and Organizations building Smarter Digital Systems.</p>
    </div>

    <div class="carousel-container relative w-full overflow-hidden scroll-animate">
        <div class="carousel-track flex gap-8 animate-scroll">
            <div *ngFor="let logo of logos; let i = index" class="carousel-item flex-shrink-0 mt-2 mb-4" [style.animation-delay.s]="0.5 + i * 0.1">
                <div class="w-[150px] h-[150px] rounded-full bg-white shadow-md hover:shadow-l transition-all duration-300 flex items-center justify-center p-6 hover:scale-105">
                    <img [src]="logo.src" [alt]="logo.alt" class="w-full h-full object-contain" />
                </div>
            </div>
            <!-- Duplicate for seamless loop -->
            <div *ngFor="let logo of logos; let i = index" class="carousel-item flex-shrink-0" [style.animation-delay.s]="0.5 + (i + 12) * 0.1">
                <div class="w-[150px] h-[150px] rounded-full bg-white shadow-md hover:shadow-l transition-all duration-300 flex items-center justify-center p-6 hover:scale-105">
                    <img [src]="logo.src" [alt]="logo.alt" class="w-full h-full object-contain" />
                </div>
            </div>
        </div>
    </div>

    <!-- Tabs Section -->
    <div class="max-w-7xl mx-auto px-6 mt-20">
        <!-- Tab Headers -->
        <div class="flex flex-wrap justify-center gap-2 mb-12 border-b border-gray-200 scroll-animate">
            <button (click)="activeTab = 'core-value'" [class.active]="activeTab === 'core-value'" class="tab-button px-6 py-3 text-[18px] font-medium text-slate-600 hover:text-orange-500 transition-colors relative">OUR CORE VALUE</button>
            <button (click)="activeTab = 'multi-team'" [class.active]="activeTab === 'multi-team'" class="tab-button px-6 py-3 text-[18px] font-medium text-slate-600 hover:text-orange-500 transition-colors relative">MULTI-DISCIPLINARY TEAM</button>
            <button (click)="activeTab = 'industry'" [class.active]="activeTab === 'industry'" class="tab-button px-6 py-3 text-[18px] font-medium text-slate-600 hover:text-orange-500 transition-colors relative">INDUSTRY EXPERTISE</button>
        </div>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Core Value Tab -->
            <div *ngIf="activeTab === 'core-value'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div *ngFor="let value of coreValues; let i = index" class="value-card group scroll-animate" [style.animation-delay.s]="i * 0.15">
                    <i [class]="'pi ' + value.icon + ' text-3xl text-slate-700 mb-4 block'" [style.animation-delay.s]="i * 0.15 + 0.2"></i>
                    <h3 class="text-xl font-semibold text-slate-800 mb-3">{{ value.title }}</h3>
                    <p class="text-[14px] text-slate-600 leading-relaxed">{{ value.description }}</p>
                </div>
            </div>

            <!-- Multi-Disciplinary Team Tab -->
            <div *ngIf="activeTab === 'multi-team'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div *ngFor="let value1 of multiteam; let i = index" class="value-card group scroll-animate" [style.animation-delay.s]="i * 0.15">
                    <i [class]="'pi ' + value1.icon + ' text-3xl text-slate-700 mb-4 block'" [style.animation-delay.s]="i * 0.15 + 0.2"></i>
                    <h3 class="text-xl font-semibold text-slate-800 mb-3">{{ value1.title }}</h3>
                    <p class="text-[14px] text-slate-600 leading-relaxed">{{ value1.description }}</p>
                </div>
            </div>

            <!-- Industry Expertise Tab -->
            <div *ngIf="activeTab === 'industry'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div *ngFor="let item of expertise; let i = index" class="value-card group scroll-animate" [style.animation-delay.s]="i * 0.15">
                    <i [class]="'pi ' + item.icon + ' text-3xl text-slate-700 mb-4 block'" [style.animation-delay.s]="i * 0.15 + 0.2"></i>
                    <h3 class="text-xl font-semibold text-slate-800 mb-3">{{ item.title }}</h3>
                    <p class="text-[14px] text-slate-600 leading-relaxed">{{ item.description }}</p>
                </div>
            </div>
        </div>
    </div>
    <div>
        <ways-of-developing-widget />
    </div>
    <div>
        <development-ways-widget />
    </div>
</div>
